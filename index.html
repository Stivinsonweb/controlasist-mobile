  <title>ControlAsist | Control de Asistencia Académica</title>
  <meta name="description" content="Sistema web de control de asistencia académica para docentes y estudiantes.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Angular emite las URLs de sus propios bundles (styles-*.css, main-*.js) como RELATIVAS.
       Sin este <base>, al entrar directo a una ruta anidada (ej. /auth/login) el navegador las
       resuelve contra esa URL (/auth/styles-*.css → 404), aunque el .htaccess ya haya servido
       este index.html correctamente — la app cargaba en blanco. -->
  <base href="/">

  <!-- PWA -->
  <!-- Rutas ABSOLUTAS (con "/" inicial): el router de Angular navega a /auth/login vía pushState
       apenas arranca (redirectTo de la ruta ''), y un href relativo aquí se re-resuelve contra esa
       URL nueva (p.ej. quedaría buscando /auth/manifest.webmanifest, un 404) — eso rompía la
       detección de instalabilidad de Chrome y por eso nunca disparaba beforeinstallprompt. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#10b981">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ControlAsist">

  <link rel="icon" type="image/svg+xml" href="/icons/logo.svg">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="icon" href="/favicon.ico" sizes="any">

  <!-- Open Graph / vista previa al compartir el link (WhatsApp, Facebook, LinkedIn).
       og:image debe ser una URL ABSOLUTA con dominio completo — WhatsApp ignora
       rutas relativas al armar la tarjeta de vista previa. -->

<div class="mx-auto max-w-lg animate-fade-in">
  <div class="mb-6">
    <h1 class="text-2xl font-bold" style="color: var(--text-primary);">Inscribir asignatura</h1>
    <p class="mt-1 text-sm" style="color: var(--text-muted);">Ingresa el código de acceso que te compartió tu docente.</p>
  </div>

  <div class="card p-6">
    <label class="mb-1.5 block text-sm font-medium" style="color: var(--text-secondary);">Código de acceso</label>
    <div class="flex gap-2">
      <input
        [(ngModel)]="codigoAcceso"
        (keyup.enter)="buscar()"
        class="input-field flex-1 text-center font-mono text-lg uppercase tracking-widest"
        placeholder="XXXX-XXXX"
        maxlength="12"
      />
      <button (click)="buscar()" [disabled]="buscando" class="btn-primary shrink-0">
        {{ buscando ? 'Buscando...' : 'Buscar' }}
      </button>
    </div>

    <!-- Resultado -->
    <div *ngIf="encontrada() as a" class="mt-6 animate-slide-up rounded-2xl border p-5" style="border-color: var(--border-subtle-2); background: rgba(255,255,255,0.04);">
      <div class="flex items-center gap-3">
        <span class="h-3.5 w-3.5 rounded-full" [style.backgroundColor]="a.color"></span>
        <div>
          <p class="text-base font-bold" style="color: var(--text-primary);">{{ a.nombre }}</p>
          <p class="text-sm" style="color: var(--text-muted);">{{ a.codigo }} · Grupo {{ a.grupo }} · {{ a.periodo }}</p>
        </div>
      </div>

      <div *ngIf="docenteEncontrado() as d" class="mt-4 flex items-center gap-3 rounded-xl px-3 py-2.5" style="background: var(--bg-surface-2);">
        <app-avatar [fotoUrl]="d.foto_url" [iniciales]="d.nombres.charAt(0) + d.apellidos.charAt(0)" colorFondo="var(--accent-from)" sizeClass="h-9 w-9 text-sm" />
        <div class="flex items-center gap-1.5">
          <p class="text-sm font-semibold" style="color: var(--text-primary);">{{ d.nombres }} {{ d.apellidos }}</p>
          <app-verificado-badge [mostrar]="!!d.verificado" />
        </div>
      </div>

      <div class="mt-4 flex gap-2">
        <button (click)="cancelar()" class="btn-outline flex-1">Cancelar</button>
        <button (click)="continuar()" class="btn-primary flex-1">Inscribirme</button>
      </div>
    </div>
  </div>
</div>
